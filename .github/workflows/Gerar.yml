name: Gerar RHzin Optimizer e APK privado

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "8.0.x"
  CONFIGURATION: "Release"

jobs:
  windows:
    name: Gerar EXE do painel
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Localizar projeto Windows
        shell: pwsh
        run: |
          $csproj = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -Filter "Optimizer.csproj" `
            -File |
            Select-Object -First 1

          if (!$csproj) {
            Write-Host "Arquivos encontrados:"
            Get-ChildItem $env:GITHUB_WORKSPACE -Recurse -File |
              Select-Object -ExpandProperty FullName

            throw "Optimizer.csproj não foi encontrado."
          }

          # Estrutura esperada:
          # PASTA_DO_PROJETO/src/Optimizer/Optimizer.csproj
          $projectRoot = $csproj.Directory.Parent.Parent.FullName

          $relativeRoot = $projectRoot.Substring(
            $env:GITHUB_WORKSPACE.Length
          ).TrimStart("\", "/")

          "PROJECT_ROOT=$relativeRoot" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "Projeto encontrado em:"
          Write-Host $projectRoot

      - name: Verificar arquivos
        shell: pwsh
        run: |
          $root = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:PROJECT_ROOT

          $required = @(
            "src/Optimizer/Optimizer.csproj",
            "src/Optimizer/MainForm.cs",
            "src/Optimizer/Auth.cs",
            "src/Optimizer/FeatureCatalog.cs",
            "src/Optimizer/Security.cs",
            "src/Optimizer/MachineProfile.cs"
          )

          foreach ($file in $required) {
            $fullPath = Join-Path $root $file

            if (!(Test-Path $fullPath)) {
              throw "Arquivo obrigatório não encontrado: $fullPath"
            }

            Write-Host "OK: $fullPath"
          }

      - name: Compilar painel
        shell: pwsh
        run: |
          $root = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:PROJECT_ROOT

          $project = Join-Path `
            $root `
            "src/Optimizer/Optimizer.csproj"

          dotnet restore $project

          dotnet build $project `
            --configuration $env:CONFIGURATION `
            --no-restore

      - name: Publicar EXE
        shell: pwsh
        run: |
          $root = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:PROJECT_ROOT

          $project = Join-Path `
            $root `
            "src/Optimizer/Optimizer.csproj"

          $output = Join-Path `
            $root `
            "out/optimizer"

          dotnet publish $project `
            --configuration $env:CONFIGURATION `
            --runtime win-x64 `
            --self-contained true `
            --output $output `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false

      - name: Preparar EXE
        shell: pwsh
        run: |
          $root = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:PROJECT_ROOT

          $output = Join-Path `
            $root `
            "out/optimizer"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "pacote-windows" |
            Out-Null

          $exe = Get-ChildItem `
            $output `
            -Filter "*.exe" `
            -Recurse |
            Select-Object -First 1

          if (!$exe) {
            throw "O EXE não foi gerado."
          }

          Copy-Item `
            $exe.FullName `
            "pacote-windows/RHzin_Optimizer.exe" `
            -Force

      - name: Publicar EXE
        uses: actions/upload-artifact@v4
        with:
          name: RHzin-Optimizer-Windows
          path: pacote-windows
          if-no-files-found: error
          retention-days: 30

  android:
    name: Gerar APK privado
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Verificar PIN privado
        shell: bash
        env:
          OWNER_PIN: ${{ secrets.RHZIN_OWNER_PIN }}
        run: |
          if [ -z "$OWNER_PIN" ]; then
            echo "ERRO: configure o secret RHZIN_OWNER_PIN."
            exit 1
          fi

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          SETTINGS=$(find "$GITHUB_WORKSPACE" \
            -path "*/src/KeyGeneratorAndroid/settings.gradle.kts" \
            -type f \
            -print \
            -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: projeto Android não encontrado."

            find "$GITHUB_WORKSPACE" \
              -maxdepth 7 \
              -type f |
              sort

            exit 1
          fi

          ANDROID_ROOT=$(dirname "$SETTINGS")

          echo "ANDROID_ROOT=$ANDROID_ROOT" \
            >> "$GITHUB_ENV"

          echo "Projeto Android:"
          echo "$ANDROID_ROOT"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceitar licenças Android
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK privado
        shell: bash
        env:
          OWNER_PIN: ${{ secrets.RHZIN_OWNER_PIN }}
        run: |
          set -e

          cd "$ANDROID_ROOT"

          gradle clean assembleRelease \
            --no-daemon \
            -PownerPin="$OWNER_PIN"

      - name: Preparar APK
        shell: bash
        run: |
          set -e

          mkdir -p pacote-apk

          APK=$(find \
            "$ANDROID_ROOT/app/build/outputs/apk/release" \
            -type f \
            -name "*.apk" \
            -print \
            -quit)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          cp "$APK" \
            "pacote-apk/RHzin_KeyGenerator_Private.apk"

          sha256sum \
            "pacote-apk/RHzin_KeyGenerator_Private.apk" \
            > "pacote-apk/RHzin_KeyGenerator_Private.apk.sha256"

          echo "APK privado do proprietário." \
            > "pacote-apk/LEIA-ME.txt"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: RHzin-KeyGenerator-Private-APK
          path: pacote-apk
          if-no-files-found: error
          retention-days: 30

  zip-final:
    name: Criar ZIP completo
    needs:
      - windows
      - android

    runs-on: ubuntu-latest

    steps:
      - name: Baixar EXE
        uses: actions/download-artifact@v4
        with:
          name: RHzin-Optimizer-Windows
          path: pacote-final

      - name: Baixar APK
        uses: actions/download-artifact@v4
        with:
          name: RHzin-KeyGenerator-Private-APK
          path: pacote-final

      - name: Criar ZIP
        shell: bash
        run: |
          echo "No painel do cliente, abra:" \
            > pacote-final/INSTRUCOES.txt

          echo "Informações do sistema > Código curto deste PC" \
            >> pacote-final/INSTRUCOES.txt

          echo "Envie o código RZ-XXXXXXXXXXXX ao proprietário." \
            >> pacote-final/INSTRUCOES.txt

          echo "No APK, informe o código, nome do cliente e PIN." \
            >> pacote-final/INSTRUCOES.txt

          cd pacote-final

          zip -r ../RHzin-Optimizer-Completo.zip .

      - name: Publicar ZIP final
        uses: actions/upload-artifact@v4
        with:
          name: RHzin-Optimizer-Completo
          path: RHzin-Optimizer-Completo.zip
          if-no-files-found: error
          retention-days: 30
