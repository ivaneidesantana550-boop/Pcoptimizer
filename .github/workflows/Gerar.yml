name: Gerar EXE e APK privado

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Gerar painel Windows
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Localizar projeto Windows
        shell: pwsh
        run: |
          $file = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -Filter "Optimizer.csproj" `
            -File |
            Select-Object -First 1

          if (!$file) {
            throw "Optimizer.csproj não encontrado."
          }

          $root = $file.Directory.Parent.Parent.FullName

          $relative = $root.Substring(
            $env:GITHUB_WORKSPACE.Length
          ).TrimStart("\", "/")

          "PROJECT_ROOT=$relative" >> $env:GITHUB_ENV

          Write-Host "Projeto encontrado em: $root"

      - name: Verificar projeto Windows
        shell: pwsh
        run: |
          $root = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:PROJECT_ROOT

          $project = Join-Path `
            $root `
            "src/Optimizer/Optimizer.csproj"

          if (!(Test-Path $project)) {
            throw "Projeto não encontrado: $project"
          }

          Write-Host "OK: $project"

      - name: Compilar painel
        shell: pwsh
        run: |
          $root = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:PROJECT_ROOT

          $project = Join-Path `
            $root `
            "src/Optimizer/Optimizer.csproj"

          dotnet restore $project

          dotnet build $project `
            -c Release `
            --no-restore

      - name: Gerar EXE
        shell: pwsh
        run: |
          $root = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:PROJECT_ROOT

          $project = Join-Path `
            $root `
            "src/Optimizer/Optimizer.csproj"

          $output = Join-Path `
            $root `
            "out/optimizer"

          dotnet publish $project `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o $output `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false

      - name: Preparar EXE
        shell: pwsh
        run: |
          $root = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:PROJECT_ROOT

          $output = Join-Path `
            $root `
            "out/optimizer"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "windows-package" |
            Out-Null

          $exe = Get-ChildItem `
            $output `
            -Filter "*.exe" `
            -Recurse |
            Select-Object -First 1

          if (!$exe) {
            throw "O EXE não foi gerado."
          }

          Copy-Item `
            $exe.FullName `
            "windows-package/RHzin_Optimizer.exe" `
            -Force

      - name: Publicar EXE
        uses: actions/upload-artifact@v4
        with:
          name: RHzin-Optimizer-Windows
          path: windows-package
          if-no-files-found: error

  android:
    name: Gerar APK privado
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Verificar PIN privado
        shell: bash
        env:
          OWNER_PIN: ${{ secrets.RHZIN_OWNER_PIN }}
        run: |
          if [ -z "$OWNER_PIN" ]; then
            echo "Configure o secret RHZIN_OWNER_PIN."
            exit 1
          fi

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          SETTINGS=$(find "$GITHUB_WORKSPACE" \
            -path "*/src/KeyGeneratorAndroid/settings.gradle.kts" \
            -type f \
            -print \
            -quit)

          if [ -z "$SETTINGS" ]; then
            echo "Projeto Android não encontrado."
            echo "Esperado: src/KeyGeneratorAndroid/settings.gradle.kts"
            exit 1
          fi

          ANDROID_ROOT=$(dirname "$SETTINGS")

          echo "ANDROID_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"

          echo "Projeto Android encontrado:"
          echo "$ANDROID_ROOT"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceitar licenças Android
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verificar arquivos Android
        shell: bash
        run: |
          test -f "$ANDROID_ROOT/settings.gradle.kts"
          test -f "$ANDROID_ROOT/build.gradle.kts"
          test -f "$ANDROID_ROOT/app/build.gradle.kts"
          test -f "$ANDROID_ROOT/app/src/main/AndroidManifest.xml"
          test -f "$ANDROID_ROOT/app/src/main/java/com/rhzin/keygenerator/MainActivity.kt"

      - name: Compilar APK privado
        shell: bash
        env:
          OWNER_PIN: ${{ secrets.RHZIN_OWNER_PIN }}
        run: |
          set -e

          cd "$ANDROID_ROOT"

          gradle clean assembleRelease \
            --no-daemon \
            -PownerPin="$OWNER_PIN"

      - name: Preparar APK
        shell: bash
        run: |
          set -e

          mkdir -p android-package

          APK=$(find \
            "$ANDROID_ROOT/app/build/outputs/apk/release" \
            -type f \
            -name "*.apk" \
            -print \
            -quit)

          if [ -z "$APK" ]; then
            echo "APK não foi gerado."
            exit 1
          fi

          cp "$APK" \
            android-package/RHzin_KeyGenerator_Private.apk

          sha256sum \
            android-package/RHzin_KeyGenerator_Private.apk \
            > android-package/RHzin_KeyGenerator_Private.apk.sha256

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: RHzin-KeyGenerator-Private-APK
          path: android-package
          if-no-files-found: error

  zip-final:
    name: Criar ZIP final
    needs:
      - windows
      - android

    runs-on: ubuntu-latest

    steps:
      - name: Baixar EXE
        uses: actions/download-artifact@v4
        with:
          name: RHzin-Optimizer-Windows
          path: final-package

      - name: Baixar APK
        uses: actions/download-artifact@v4
        with:
          name: RHzin-KeyGenerator-Private-APK
          path: final-package

      - name: Criar ZIP
        shell: bash
        run: |
          echo "RHzin Optimizer" > final-package/INSTRUCOES.txt
          echo "O cliente deve enviar o código RZ-XXXXXXXXXXXX." >> final-package/INSTRUCOES.txt
          echo "Use o APK privado para gerar LOGIN, SENHA e KEY." >> final-package/INSTRUCOES.txt

          cd final-package

          zip -r ../RHzin-Optimizer-Completo.zip .

      - name: Publicar ZIP completo
        uses: actions/upload-artifact@v4
        with:
          name: RHzin-Optimizer-Completo
          path: RHzin-Optimizer-Completo.zip
          if-no-files-found: error
