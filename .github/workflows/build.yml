name: Gerar EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extrair zip (se existir)
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Recurse -Filter "rhzin-optimizer-exe*.zip" | Select-Object -First 1
          if ($zip) {
            Write-Host "Extraindo $($zip.FullName)"
            Expand-Archive -Path $zip.FullName -DestinationPath "$PWD/fonte" -Force
          } else {
            Write-Host "Sem zip, usando os arquivos do repositorio."
          }

      - name: Localizar projetos
        shell: pwsh
        run: |
          $opt = Get-ChildItem -Recurse -Filter Optimizer.csproj | Select-Object -First 1
          $gen = Get-ChildItem -Recurse -Filter Gerador.csproj | Select-Object -First 1
          if (-not $opt -or -not $gen) { Write-Error "csproj nao encontrado"; Get-ChildItem -Recurse | Select-Object -First 50 FullName; exit 1 }
          "OPT=$($opt.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "GEN=$($gen.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "ROOT=$($opt.Directory.Parent.Parent.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Publicar o otimizador
        run: dotnet publish "$env:OPT" -c Release -r win-x64 --self-contained true -o out

      - name: Publicar o gerador de licencas
        run: dotnet publish "$env:GEN" -c Release -r win-x64 --self-contained true -o out

      - name: Montar o pacote
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pacote | Out-Null
          foreach ($f in "RHzin_Optimizer.exe", "RHzin_Gerador_Licenca.exe") {
            if (-not (Test-Path "out/$f")) { Write-Error "Faltou $f"; Get-ChildItem out; exit 1 }
            Copy-Item "out/$f" pacote/
          }
          $leia = Join-Path $env:ROOT "LEIA-ME.txt"
          if (Test-Path $leia) { Copy-Item $leia pacote/ }
          Get-ChildItem pacote

      - uses: actions/upload-artifact@v4
        with:
          name: RHzin_Optimizer_4_0
          path: pacote/*
