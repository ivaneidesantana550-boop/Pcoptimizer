name: Gerar EXE para Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Localizar e extrair ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = $env:GITHUB_WORKSPACE

          Write-Host "Procurando arquivos ZIP..."

          $zips = @(
            Get-ChildItem $base -Filter "*.zip" -File -Recurse |
            Where-Object {
              $_.FullName -notmatch '\\.git\\|\\bin\\|\\obj\\|\\extraido\\|\\saida\\'
            }
          )

          if ($zips.Count -eq 0) {
            Write-Host "Arquivos presentes no repositorio:"
            Get-ChildItem $base -Recurse -File |
              Select-Object -First 100 FullName
            throw "Nenhum ZIP encontrado. Envie o arquivo ZIP original ao repositorio."
          }

          $zip = $zips | Select-Object -First 1
          Write-Host "ZIP selecionado: $($zip.FullName)"

          $dest = Join-Path $base "extraido"

          if (Test-Path $dest) {
            Remove-Item $dest -Recurse -Force
          }

          New-Item -ItemType Directory -Path $dest -Force |
            Out-Null

          Expand-Archive -LiteralPath $zip.FullName `
            -DestinationPath $dest -Force

          Write-Host "Arquivos extraidos:"
          Get-ChildItem $dest -Recurse -File |
            Select-Object -First 100 FullName

      - name: Localizar projetos
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "extraido"
          $projects = @(Get-ChildItem $root -Filter "*.csproj" -File -Recurse)

          if ($projects.Count -eq 0) {
            throw "Nenhum projeto C# .csproj foi encontrado no ZIP."
          }

          Write-Host "Projetos encontrados:"
          $projects | ForEach-Object {
            Write-Host $_.FullName
          }

          $optimizer = $projects |
            Where-Object { $_.Name -eq "Optimizer.csproj" } |
            Select-Object -First 1

          $gerador = $projects |
            Where-Object { $_.Name -eq "Gerador.csproj" } |
            Select-Object -First 1

          if (-not $optimizer) {
            throw "Optimizer.csproj nao encontrado."
          }

          if (-not $gerador) {
            throw "Gerador.csproj nao encontrado."
          }

      - name: Compilar Optimizer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:GITHUB_WORKSPACE "extraido"
          $project = Get-ChildItem $root -Filter "Optimizer.csproj" -File -Recurse |
            Select-Object -First 1
          $out = Join-Path $env:GITHUB_WORKSPACE "saida\Optimizer"

          New-Item -ItemType Directory -Path $out -Force |
            Out-Null

          dotnet publish $project.FullName `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:UseAppHost=true `
            -o $out

          if ($LASTEXITCODE -ne 0) {
            throw "A compilacao do Optimizer falhou."
          }

          Write-Host "Resultado da compilacao:"
          Get-ChildItem $out -Recurse -File |
            Select-Object FullName, Length

      - name: Compilar Gerador de Licenca
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:GITHUB_WORKSPACE "extraido"
          $project = Get-ChildItem $root -Filter "Gerador.csproj" -File -Recurse |
            Select-Object -First 1
          $out = Join-Path $env:GITHUB_WORKSPACE "saida\Gerador"

          New-Item -ItemType Directory -Path $out -Force |
            Out-Null

          dotnet publish $project.FullName `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:UseAppHost=true `
            -o $out

          if ($LASTEXITCODE -ne 0) {
            throw "A compilacao do Gerador de Licenca falhou."
          }

          Write-Host "Resultado da compilacao:"
          Get-ChildItem $out -Recurse -File |
            Select-Object FullName, Length

      - name: Preparar arquivos finais
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = $env:GITHUB_WORKSPACE
          $optimizerDir = Join-Path $base "saida\Optimizer"
          $geradorDir = Join-Path $base "saida\Gerador"
          $dest = Join-Path $base "RHzin-Optimizer-Windows"
          $zipFinal = Join-Path $base "RHzin-Optimizer-Windows.zip"

          $optimizer = Get-ChildItem $optimizerDir -Filter "*.exe" -File -Recurse |
            Select-Object -First 1

          $gerador = Get-ChildItem $geradorDir -Filter "*.exe" -File -Recurse |
            Select-Object -First 1

          if (-not $optimizer) {
            throw "Nenhum EXE foi gerado para o Optimizer. Consulte a etapa de compilacao."
          }

          if (-not $gerador) {
            throw "Nenhum EXE foi gerado para o Gerador. Consulte a etapa de compilacao."
          }

          if (Test-Path $dest) {
            Remove-Item $dest -Recurse -Force
          }

          New-Item -ItemType Directory -Path $dest -Force |
            Out-Null

          Copy-Item $optimizer.FullName `
            (Join-Path $dest "RHzin_Optimizer.exe")

          Copy-Item $gerador.FullName `
            (Join-Path $dest "RHzin_Gerador_Licenca.exe")

          $readme = Get-ChildItem (Join-Path $base "extraido") `
            -Filter "LEIA-ME.txt" -File -Recurse |
            Select-Object -First 1

          if ($readme) {
            Copy-Item $readme.FullName `
              (Join-Path $dest "LEIAME.txt")
          }

          Compress-Archive -Path "$dest\*" `
            -DestinationPath $zipFinal -Force

          Write-Host "Pacote criado:"
          Get-Item $zipFinal | Select-Object FullName, Length

      - name: Disponibilizar download
        uses: actions/upload-artifact@v4
        with:
          name: RHzin-Optimizer-Windows
          path: RHzin-Optimizer-Windows.zip
          if-no-files-found: error
          retention-days: 7
