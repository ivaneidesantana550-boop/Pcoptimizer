name: Gerar EXE para Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            9.0.x

      - name: Localizar e extrair ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = $env:GITHUB_WORKSPACE

          $zip = Get-ChildItem $base -Filter "rhzin-optimizer-exe*.zip" -File -Recurse |
            Where-Object {
              $_.FullName -notmatch '\\.git\\|\\bin\\|\\obj\\|\\extraido\\'
            } |
            Select-Object -First 1

          if (-not $zip) {
            $zip = Get-ChildItem $base -Filter "*.zip" -File -Recurse |
              Where-Object {
                $_.FullName -notmatch '\\.git\\|\\bin\\|\\obj\\|\\extraido\\'
              } |
              Select-Object -First 1
          }

          if (-not $zip) {
            Get-ChildItem $base -Recurse -File |
              Select-Object -First 100 FullName
            throw "Nenhum arquivo ZIP foi encontrado. Envie o ZIP original para o repositorio."
          }

          Write-Host "ZIP encontrado: $($zip.FullName)"

          $extract = Join-Path $base "extraido"

          if (Test-Path $extract) {
            Remove-Item $extract -Recurse -Force
          }

          New-Item -ItemType Directory -Path $extract -Force |
            Out-Null

          Expand-Archive -LiteralPath $zip.FullName `
            -DestinationPath $extract -Force

          Write-Host "Conteudo extraido:"
          Get-ChildItem $extract -Recurse -File |
            Select-Object -First 100 FullName

      - name: Restaurar e verificar projetos
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:GITHUB_WORKSPACE "extraido"

          $projects = @(Get-ChildItem $root -Filter "*.csproj" -File -Recurse)

          if ($projects.Count -eq 0) {
            throw "Nenhum arquivo .csproj foi encontrado dentro do ZIP."
          }

          Write-Host "Projetos encontrados:"
          $projects | ForEach-Object {
            Write-Host $_.FullName
          }

          $optimizer = $projects |
            Where-Object { $_.Name -eq "Optimizer.csproj" } |
            Select-Object -First 1

          $gerador = $projects |
            Where-Object { $_.Name -eq "Gerador.csproj" } |
            Select-Object -First 1

          if (-not $optimizer) {
            throw "Optimizer.csproj nao encontrado. Confira o nome do projeto."
          }

          if (-not $gerador) {
            throw "Gerador.csproj nao encontrado. Confira o nome do projeto."
          }

          Write-Host "Configuracao do Optimizer.csproj:"
          Get-Content $optimizer.FullName

          Write-Host "Configuracao do Gerador.csproj:"
          Get-Content $gerador.FullName

      - name: Compilar Optimizer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:GITHUB_WORKSPACE "extraido"

          $project = Get-ChildItem $root -Filter "Optimizer.csproj" -File -Recurse |
            Select-Object -First 1

          $out = Join-Path $env:GITHUB_WORKSPACE "saida\Optimizer"

          New-Item -ItemType Directory -Path $out -Force |
            Out-Null

          dotnet restore $project.FullName

          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao restaurar o projeto Optimizer."
          }

          dotnet publish $project.FullName `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:UseAppHost=true `
            -o $out

          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao compilar o Optimizer. Confira as mensagens acima."
          }

          Write-Host "Arquivos gerados pelo Optimizer:"
          Get-ChildItem $out -Recurse -File |
            Select-Object FullName, Length

      - name: Compilar Gerador de Licenca
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:GITHUB_WORKSPACE "extraido"

          $project = Get-ChildItem $root -Filter "Gerador.csproj" -File -Recurse |
            Select-Object -First 1

          $out = Join-Path $env:GITHUB_WORKSPACE "saida\Gerador"

          New-Item -ItemType Directory -Path $out -Force |
            Out-Null

          dotnet restore $project.FullName

          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao restaurar o projeto Gerador."
          }

          dotnet publish $project.FullName `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:UseAppHost=true `
            -o $out

          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao compilar o Gerador de Licenca. Confira as mensagens acima."
          }

          Write-Host "Arquivos gerados pelo Gerador:"
          Get-ChildItem $out -Recurse -File |
            Select-Object FullName, Length

      - name: Preparar arquivos finais
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = $env:GITHUB_WORKSPACE

          $optimizerDir = Join-Path $base "saida\Optimizer"
          $geradorDir = Join-Path $base "saida\Gerador"
          $dest = Join-Path $base "RHzin-Optimizer-Windows"
          $zipFinal = Join-Path $base "RHzin-Optimizer-Windows.zip"

          Write-Host "Verificando os executaveis..."

          foreach ($dir in @($optimizerDir, $geradorDir)) {
            if (-not (Test-Path $dir)) {
              throw "Pasta de compilacao nao encontrada: $dir"
            }

            Write-Host "Conteudo de $dir"
            Get-ChildItem $dir -Recurse -File |
              Select-Object FullName, Length
          }

          $optimizer = Get-ChildItem $optimizerDir `
            -Filter "*.exe" -File -Recurse |
            Sort-Object Length -Descending |
            Select-Object -First 1

          $gerador = Get-ChildItem $geradorDir `
            -Filter "*.exe" -File -Recurse |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if (-not $optimizer) {
            throw "O projeto Optimizer nao gerou nenhum EXE. Consulte a configuracao OutputType e os arquivos listados acima."
          }

          if (-not $gerador) {
            throw "O projeto Gerador nao gerou nenhum EXE. Consulte a configuracao OutputType e os arquivos listados acima."
          }

          if (Test-Path $dest) {
            Remove-Item $dest -Recurse -Force
          }

          New-Item -ItemType Directory -Path $dest -Force |
            Out-Null

          Copy-Item $optimizer.FullName `
            (Join-Path $dest "RHzin_Optimizer.exe") -Force

          Copy-Item $gerador.FullName `
            (Join-Path $dest "RHzin_Gerador_Licenca.exe") -Force

          $readme = Get-ChildItem (Join-Path $base "extraido") `
            -Filter "LEIA-ME.txt" -File -Recurse |
            Select-Object -First 1

          if ($readme) {
            Copy-Item $readme.FullName `
              (Join-Path $dest "LEIAME.txt") -Force
          }

          if (Test-Path $zipFinal) {
            Remove-Item $zipFinal -Force
          }

          Compress-Archive -Path "$dest\*" `
            -DestinationPath $zipFinal -Force

          Write-Host "Pacote final criado:"
          Get-Item $zipFinal | Select-Object FullName, Length

      - name: Disponibilizar download
        uses: actions/upload-artifact@v4
        with:
          name: RHzin-Optimizer-Windows
          path: RHzin-Optimizer-Windows.zip
          if-no-files-found: error
          retention-days: 7
