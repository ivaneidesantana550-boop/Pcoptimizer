name: Compilar RHzin e Gerar ZIP

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v5

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extrair codigos do ZIP
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          $sourceRoot = $root

          $optimizer = Get-ChildItem $root -Recurse -Filter Optimizer.csproj |
            Select-Object -First 1

          if (-not $optimizer) {
            $zip = Get-ChildItem $root -File -Filter '*.zip' |
              Where-Object { $_.Name -like 'rhzin-optimizer-exe*' } |
              Select-Object -First 1

            if (-not $zip) {
              throw "ZIP original rhzin-optimizer-exe nao encontrado."
            }

            $sourceRoot = Join-Path $env:RUNNER_TEMP 'rhzin-source'
            New-Item -ItemType Directory -Force $sourceRoot | Out-Null
            Expand-Archive $zip.FullName $sourceRoot -Force
          }

          $optimizer = Get-ChildItem $sourceRoot -Recurse -Filter Optimizer.csproj |
            Select-Object -First 1
          $gerador = Get-ChildItem $sourceRoot -Recurse -Filter Gerador.csproj |
            Select-Object -First 1

          if (-not $optimizer) { throw "Optimizer.csproj nao encontrado." }
          if (-not $gerador) { throw "Gerador.csproj nao encontrado." }

          "OPTIMIZER_PROJECT=$($optimizer.FullName)" >> $env:GITHUB_ENV
          "GERADOR_PROJECT=$($gerador.FullName)" >> $env:GITHUB_ENV

          $readme = Get-ChildItem $sourceRoot -Recurse -File |
            Where-Object { $_.Name -in @('LEIA-ME.txt','LEIAME.txt') } |
            Select-Object -First 1

          if ($readme) {
            "README_SOURCE=$($readme.FullName)" >> $env:GITHUB_ENV
          }

      - name: Compilar RHzin Optimizer
        shell: pwsh
        run: |
          dotnet publish "$env:OPTIMIZER_PROJECT" `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o "$env:RUNNER_TEMP\saida\Optimizer"

      - name: Compilar gerador de licenca
        shell: pwsh
        run: |
          dotnet publish "$env:GERADOR_PROJECT" `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o "$env:RUNNER_TEMP\saida\Gerador"

      - name: Criar ZIP final
        shell: pwsh
        run: |
          $base = "$env:RUNNER_TEMP\saida"
          $pacote = "$env:RUNNER_TEMP\pacote"

          New-Item -ItemType Directory -Force $pacote | Out-Null

          $opt = Get-ChildItem "$base\Optimizer" -Filter '*.exe' |
            Select-Object -First 1
          $lic = Get-ChildItem "$base\Gerador" -Filter '*.exe' |
            Select-Object -First 1

          if (-not $opt) { throw "O EXE do otimizador nao foi gerado." }
          if (-not $lic) { throw "O EXE do gerador nao foi gerado." }

          Copy-Item $opt.FullName "$pacote\RHzin_Optimizer.exe"
          Copy-Item $lic.FullName "$pacote\RHzin_Gerador_Licenca.exe"

          if ($env:README_SOURCE -and (Test-Path $env:README_SOURCE)) {
            Copy-Item $env:README_SOURCE "$pacote\LEIAME.txt"
          } else {
            @"
          RHZIN OPTIMIZER 4.0

          Arquivos:
          - RHzin_Optimizer.exe
          - RHzin_Gerador_Licenca.exe

          Extraia os arquivos antes de executar.
          "@ | Set-Content "$pacote\LEIAME.txt"
          }

          Compress-Archive -Path "$pacote\*" `
            -DestinationPath "$env:GITHUB_WORKSPACE\RHzin-Optimizer.zip" -Force

      - name: Disponibilizar ZIP para download
        uses: actions/upload-artifact@v4
        with:
          name: RHzin-Optimizer-Windows
          path: RHzin-Optimizer.zip
          if-no-files-found: error
