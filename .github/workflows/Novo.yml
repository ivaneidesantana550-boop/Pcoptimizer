name: Gerar EXE para Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Localizar e extrair ZIP
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter "*.zip" -Recurse |
            Where-Object {
              $_.FullName -notmatch '\\.git\\|\\bin\\|\\obj\\'
            } |
            Select-Object -First 1

          if (-not $zip) {
            Write-Host "Arquivos encontrados no repositorio:"
            Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse |
              Select-Object -First 100 FullName
            throw "Nenhum arquivo ZIP encontrado. Coloque o ZIP no repositorio do GitHub."
          }

          Write-Host "ZIP encontrado: $($zip.FullName)"

          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE\extraido" -Force | Out-Null

          Expand-Archive `
            -LiteralPath $zip.FullName `
            -DestinationPath "$env:GITHUB_WORKSPACE\extraido" `
            -Force

      - name: Encontrar projetos C#
        id: projetos
        shell: pwsh
        run: |
          $projects = Get-ChildItem `
            -Path "$env:GITHUB_WORKSPACE\extraido" `
            -Filter "*.csproj" `
            -Recurse

          if (-not $projects) {
            Get-ChildItem "$env:GITHUB_WORKSPACE\extraido" -Recurse |
              Select-Object FullName
            throw "Nenhum projeto .csproj foi encontrado dentro do ZIP."
          }

          $projects | ForEach-Object {
            Write-Host "Projeto encontrado: $($_.FullName)"
          }

      - name: Compilar Optimizer
        shell: pwsh
        run: |
          $project = Get-ChildItem `
            -Path "$env:GITHUB_WORKSPACE\extraido" `
            -Filter "Optimizer.csproj" `
            -Recurse |
            Select-Object -First 1

          if (-not $project) {
            throw "Optimizer.csproj nao encontrado."
          }

          dotnet publish $project.FullName `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -o "$env:GITHUB_WORKSPACE\saida\Optimizer"

      - name: Compilar Gerador de Licenca
        shell: pwsh
        run: |
          $project = Get-ChildItem `
            -Path "$env:GITHUB_WORKSPACE\extraido" `
            -Filter "Gerador.csproj" `
            -Recurse |
            Select-Object -First 1

          if (-not $project) {
            throw "Gerador.csproj nao encontrado."
          }

          dotnet publish $project.FullName `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -o "$env:GITHUB_WORKSPACE\saida\Gerador"

      - name: Preparar arquivos finais
        shell: pwsh
        run: |
          $dest = "$env:GITHUB_WORKSPACE\RHzin-Optimizer-Windows"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null

          $optimizer = Get-ChildItem `
            "$env:GITHUB_WORKSPACE\saida\Optimizer" `
            -Filter "Optimizer.exe" `
            -Recurse |
            Select-Object -First 1

          $gerador = Get-ChildItem `
            "$env:GITHUB_WORKSPACE\saida\Gerador" `
            -Filter "Gerador.exe" `
            -Recurse |
            Select-Object -First 1

          if (-not $optimizer) {
            throw "Optimizer.exe nao foi gerado."
          }

          if (-not $gerador) {
            throw "Gerador.exe nao foi gerado."
          }

          Copy-Item $optimizer.FullName "$dest\RHzin_Optimizer.exe"
          Copy-Item $gerador.FullName "$dest\RHzin_Gerador_Licenca.exe"

          $readme = Get-ChildItem `
            "$env:GITHUB_WORKSPACE\extraido" `
            -Filter "LEIA-ME.txt" `
            -Recurse |
            Select-Object -First 1

          if ($readme) {
            Copy-Item $readme.FullName "$dest\LEIAME.txt"
          }

          Compress-Archive `
            -Path "$dest\*" `
            -DestinationPath "$env:GITHUB_WORKSPACE\RHzin-Optimizer-Windows.zip" `
            -Force

      - name: Disponibilizar EXEs para download
        uses: actions/upload-artifact@v4
        with:
          name: RHzin-Optimizer-Windows
          path: RHzin-Optimizer-Windows.zip
          if-no-files-found: error
